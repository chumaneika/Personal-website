spring:
  datasource:
    url: jdbc:h2:mem:personal_website_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  admin:
    initializer:
      enabled: false
  contact:
    notifications:
      email:
        enabled: false
