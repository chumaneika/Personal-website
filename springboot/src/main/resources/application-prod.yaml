server:
  address: ${APP_SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true

app:
  admin:
    initializer:
      enabled: ${APP_ADMIN_INITIALIZER_ENABLED:false}
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
    recovery:
      enabled: ${APP_ADMIN_RECOVERY_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  security:
    require-https: true
