spring:
  application:
    name: personal-website-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:configtree:${APP_SECRETS_DIRECTORY:/run/secrets/}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  mail:
    password: ${SPRING_MAIL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}
    json:
      add:
        service.name: ${spring.application.name}

sentry:
  enabled: ${SENTRY_ENABLED:true}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:default}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${APP_SESSION_COOKIE_SECURE:false}
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:lax}

app:
  admin:
    initializer:
      enabled: ${APP_ADMIN_INITIALIZER_ENABLED:false}
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
    recovery:
      enabled: ${APP_ADMIN_RECOVERY_ENABLED:false}
      email: ${APP_ADMIN_RECOVERY_EMAIL:}
      password: ${APP_ADMIN_RECOVERY_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}
  contact:
    max-request-bytes: ${APP_CONTACT_MAX_REQUEST_BYTES:16384}
    duplicate-window: ${APP_CONTACT_DUPLICATE_WINDOW:24h}
    rate-limit:
      max-submissions: ${APP_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS:5}
      window: ${APP_CONTACT_RATE_LIMIT_WINDOW:10m}
    retention:
      enabled: ${APP_CONTACT_RETENTION_ENABLED:true}
      cron: "${APP_CONTACT_RETENTION_CRON:0 30 3 * * *}"
      archive-read-after: ${APP_CONTACT_ARCHIVE_READ_AFTER:30d}
      delete-archived-after: ${APP_CONTACT_DELETE_ARCHIVED_AFTER:365d}
    notifications:
      email:
        enabled: ${APP_CONTACT_EMAIL_NOTIFICATIONS_ENABLED:false}
        from: ${APP_CONTACT_EMAIL_FROM:}
        to: ${APP_CONTACT_EMAIL_TO:}
        subject: ${APP_CONTACT_EMAIL_SUBJECT:New contact form message}
  security:
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:false}
    login:
      max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
      attempt-window: ${APP_LOGIN_ATTEMPT_WINDOW:15m}
      block-duration: ${APP_LOGIN_BLOCK_DURATION:15m}
