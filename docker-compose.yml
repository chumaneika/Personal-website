name: personal-website

services:
  edge-proxy:
    image: personal-website-edge-proxy:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/reverse-proxy/Dockerfile
    container_name: personal-website-edge-proxy
    restart: unless-stopped
    depends_on:
      frontend-public:
        condition: service_healthy
      frontend-admin:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTP_PORT:-80}:80/tcp"
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTPS_PORT:-443}:443/tcp"
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge

  postgres:
    image: postgres:16-alpine
    container_name: personal-website-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database

  postgres-backup:
    image: postgres:16-alpine
    container_name: personal-website-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETRY_SECONDS: ${POSTGRES_BACKUP_RETRY_SECONDS:-300}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    entrypoint:
      - /bin/sh
      - /scripts/backup-loop.sh
    volumes:
      - ${POSTGRES_BACKUP_DIRECTORY:-./backups/postgres}:/backups
      - ./ops/postgres:/scripts:ro
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    image: personal-website-backend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: personal-website-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_SECRETS_DIRECTORY: /run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      APP_ADMIN_INITIALIZER_ENABLED: ${APP_ADMIN_INITIALIZER_ENABLED:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_RECOVERY_ENABLED: ${APP_ADMIN_RECOVERY_ENABLED:-false}
      APP_ADMIN_RECOVERY_EMAIL: ${APP_ADMIN_RECOVERY_EMAIL:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-30m}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-strict}
      APP_SECURITY_REQUIRE_HTTPS: ${APP_SECURITY_REQUIRE_HTTPS:-true}
      APP_LOGIN_MAX_ATTEMPTS: ${APP_LOGIN_MAX_ATTEMPTS:-5}
      APP_LOGIN_ATTEMPT_WINDOW: ${APP_LOGIN_ATTEMPT_WINDOW:-15m}
      APP_LOGIN_BLOCK_DURATION: ${APP_LOGIN_BLOCK_DURATION:-15m}
      APP_CONTACT_MAX_REQUEST_BYTES: ${APP_CONTACT_MAX_REQUEST_BYTES:-16384}
      APP_CONTACT_DUPLICATE_WINDOW: ${APP_CONTACT_DUPLICATE_WINDOW:-24h}
      APP_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS: ${APP_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS:-5}
      APP_CONTACT_RATE_LIMIT_WINDOW: ${APP_CONTACT_RATE_LIMIT_WINDOW:-10m}
      APP_CONTACT_RETENTION_ENABLED: ${APP_CONTACT_RETENTION_ENABLED:-true}
      APP_CONTACT_RETENTION_CRON: ${APP_CONTACT_RETENTION_CRON:-0 30 3 * * *}
      APP_CONTACT_ARCHIVE_READ_AFTER: ${APP_CONTACT_ARCHIVE_READ_AFTER:-30d}
      APP_CONTACT_DELETE_ARCHIVED_AFTER: ${APP_CONTACT_DELETE_ARCHIVED_AFTER:-365d}
      APP_CONTACT_EMAIL_NOTIFICATIONS_ENABLED: ${APP_CONTACT_EMAIL_NOTIFICATIONS_ENABLED:-false}
      APP_CONTACT_EMAIL_FROM: ${APP_CONTACT_EMAIL_FROM:-}
      APP_CONTACT_EMAIL_TO: ${APP_CONTACT_EMAIL_TO:-}
      APP_CONTACT_EMAIL_SUBJECT: ${APP_CONTACT_EMAIL_SUBJECT:-New contact form message}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY:-true}
      APP_SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    expose:
      - "8080"
    secrets:
      - source: postgres_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: admin_password
        target: APP_ADMIN_PASSWORD
      - source: admin_recovery_password
        target: APP_ADMIN_RECOVERY_PASSWORD
      - source: smtp_password
        target: SPRING_MAIL_PASSWORD
    networks:
      - application
      - database

  frontend-public:
    image: personal-website-frontend-public:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/frontend/Dockerfile
      args:
        FRONTEND_WORKSPACE: frontend-public
        VITE_PUBLIC_API_URL: ${PUBLIC_FRONTEND_API_URL:-/api}
    container_name: personal-website-frontend-public
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - application

  frontend-admin:
    image: personal-website-frontend-admin:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/frontend/Dockerfile
      args:
        FRONTEND_WORKSPACE: frontend-admin
        VITE_ADMIN_API_URL: ${ADMIN_FRONTEND_API_URL:-/api}
    container_name: personal-website-frontend-admin
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - application

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  application:
    driver: bridge
  database:
    driver: bridge
    internal: true

secrets:
  postgres_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/SPRING_DATASOURCE_PASSWORD
  admin_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/APP_ADMIN_PASSWORD
  admin_recovery_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/APP_ADMIN_RECOVERY_PASSWORD
  smtp_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/SPRING_MAIL_PASSWORD
