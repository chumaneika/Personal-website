name: personal-website

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  edge-proxy:
    image: personal-website-edge-proxy:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/reverse-proxy/Dockerfile
    container_name: personal-website-edge-proxy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend-public:
        condition: service_healthy
      frontend-admin:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTP_PORT:-80}:80/tcp"
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTPS_PORT:-443}:443/tcp"
      - "${REVERSE_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVERSE_PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - application

  postgres:
    image: postgres:16-alpine
    container_name: personal-website-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database

  postgres-backup:
    image: postgres:16-alpine
    container_name: personal-website-postgres-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETRY_SECONDS: ${POSTGRES_BACKUP_RETRY_SECONDS:-300}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    entrypoint:
      - /bin/sh
      - /scripts/backup-loop.sh
    volumes:
      - ${POSTGRES_BACKUP_DIRECTORY:-./backups/postgres}:/backups
      - ./ops/postgres:/scripts:ro
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    image: personal-website-backend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: personal-website-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_SECRETS_DIRECTORY: /run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      APP_ADMIN_INITIALIZER_ENABLED: ${APP_ADMIN_INITIALIZER_ENABLED:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_RECOVERY_ENABLED: ${APP_ADMIN_RECOVERY_ENABLED:-false}
      APP_ADMIN_RECOVERY_EMAIL: ${APP_ADMIN_RECOVERY_EMAIL:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-30m}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-strict}
      APP_SECURITY_REQUIRE_HTTPS: ${APP_SECURITY_REQUIRE_HTTPS:-true}
      APP_LOGIN_MAX_ATTEMPTS: ${APP_LOGIN_MAX_ATTEMPTS:-5}
      APP_LOGIN_ATTEMPT_WINDOW: ${APP_LOGIN_ATTEMPT_WINDOW:-15m}
      APP_LOGIN_BLOCK_DURATION: ${APP_LOGIN_BLOCK_DURATION:-15m}
      APP_CONTACT_MAX_REQUEST_BYTES: ${APP_CONTACT_MAX_REQUEST_BYTES:-16384}
      APP_CONTACT_DUPLICATE_WINDOW: ${APP_CONTACT_DUPLICATE_WINDOW:-24h}
      APP_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS: ${APP_CONTACT_RATE_LIMIT_MAX_SUBMISSIONS:-5}
      APP_CONTACT_RATE_LIMIT_WINDOW: ${APP_CONTACT_RATE_LIMIT_WINDOW:-10m}
      APP_CONTACT_RETENTION_ENABLED: ${APP_CONTACT_RETENTION_ENABLED:-true}
      APP_CONTACT_RETENTION_CRON: ${APP_CONTACT_RETENTION_CRON:-0 30 3 * * *}
      APP_CONTACT_ARCHIVE_READ_AFTER: ${APP_CONTACT_ARCHIVE_READ_AFTER:-30d}
      APP_CONTACT_DELETE_ARCHIVED_AFTER: ${APP_CONTACT_DELETE_ARCHIVED_AFTER:-365d}
      APP_CONTACT_EMAIL_NOTIFICATIONS_ENABLED: ${APP_CONTACT_EMAIL_NOTIFICATIONS_ENABLED:-false}
      APP_CONTACT_EMAIL_FROM: ${APP_CONTACT_EMAIL_FROM:-}
      APP_CONTACT_EMAIL_TO: ${APP_CONTACT_EMAIL_TO:-}
      APP_CONTACT_EMAIL_SUBJECT: ${APP_CONTACT_EMAIL_SUBJECT:-New contact form message}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      APP_SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    expose:
      - "8080"
    secrets:
      - source: postgres_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: admin_password
        target: APP_ADMIN_PASSWORD
      - source: admin_recovery_password
        target: APP_ADMIN_RECOVERY_PASSWORD
      - source: smtp_password
        target: SPRING_MAIL_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - application
      - database

  frontend-public:
    image: personal-website-frontend-public:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/frontend-public/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${PUBLIC_FRONTEND_API_URL:-/api}
        VITE_PUBLIC_SENTRY_DSN: ${VITE_PUBLIC_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_RELEASE: ${VITE_RELEASE:-}
    container_name: personal-website-frontend-public
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_BACKEND_INTERNAL_URL: ${PUBLIC_BACKEND_INTERNAL_URL:-http://backend:8080/api}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:?PUBLIC_SITE_ORIGIN is required}
      HOST: 0.0.0.0
      PORT: 8080
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - application

  frontend-admin:
    image: personal-website-frontend-admin:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: .
      dockerfile: ops/frontend/Dockerfile
      args:
        FRONTEND_WORKSPACE: frontend-admin
        VITE_ADMIN_API_URL: ${ADMIN_FRONTEND_API_URL:-/api}
        VITE_ADMIN_SENTRY_DSN: ${VITE_ADMIN_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_RELEASE: ${VITE_RELEASE:-}
    container_name: personal-website-frontend-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - application

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: personal-website-prometheus
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUBLIC_SITE_PROBE_URL: ${PUBLIC_SITE_PROBE_URL:?PUBLIC_SITE_PROBE_URL is required}
      ADMIN_SITE_PROBE_URL: ${ADMIN_SITE_PROBE_URL:?ADMIN_SITE_PROBE_URL is required}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-production}
    entrypoint:
      - /bin/sh
      - /etc/prometheus/render-config.sh
    command:
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090/tcp"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./ops/observability/prometheus/render-config.sh:/etc/prometheus/render-config.sh:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - application
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: personal-website-alertmanager
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093/tcp"
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - source: alertmanager_webhook_url
        target: ALERTMANAGER_WEBHOOK_URL
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: personal-website-blackbox-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/blackbox-exporter/blackbox.yml
    volumes:
      - ./ops/observability/blackbox/blackbox.yml:/etc/blackbox-exporter/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - application
      - monitoring

  loki:
    image: personal-website-loki:3.7.0
    build:
      context: .
      dockerfile: ops/observability/loki/Dockerfile
    container_name: personal-website-loki
    restart: unless-stopped
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./ops/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: personal-website-alloy
    restart: unless-stopped
    logging: *default-logging
    environment:
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-production}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    user: "0:0"
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/12345;
          printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          case "$$status" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.1
    container_name: personal-website-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_METRICS_ENABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000/tcp"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - source: grafana_admin_password
        target: GRAFANA_ADMIN_PASSWORD
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - monitoring

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  edge:
    driver: bridge
  application:
    driver: bridge
  database:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

secrets:
  postgres_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/SPRING_DATASOURCE_PASSWORD
  admin_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/APP_ADMIN_PASSWORD
  admin_recovery_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/APP_ADMIN_RECOVERY_PASSWORD
  smtp_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/SPRING_MAIL_PASSWORD
  grafana_admin_password:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/GRAFANA_ADMIN_PASSWORD
  alertmanager_webhook_url:
    file: ${APP_SECRETS_DIRECTORY:?APP_SECRETS_DIRECTORY is required}/ALERTMANAGER_WEBHOOK_URL
